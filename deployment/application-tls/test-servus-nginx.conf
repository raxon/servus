server {
  listen 443 ssl;
  server_name test.servus.run;
  ssl_certificate /var/lib/servus-app-tls/config/live/test.servus.run/fullchain.pem;
  ssl_certificate_key /var/lib/servus-app-tls/config/live/test.servus.run/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  if ($host != 'test.servus.run') { return 444; }
  location / {
    proxy_pass http://127.0.0.1:80;
    proxy_http_version 1.1;
    proxy_set_header Host welcome.localhost;
    proxy_set_header X-Forwarded-Host test.servus.run;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
    proxy_buffering off;
  }
}
