services:
  challenge:
    image: nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    volumes:
      - type: bind
        source: /var/lib/servus-app-tls/webroot
        target: /usr/share/nginx/html
        read_only: true
    networks: [ingress]
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.id == ${CHALLENGE_NODE_ID:?Set CHALLENGE_NODE_ID}
      labels:
        traefik.enable: 'true'
        traefik.swarm.network: panel-ingress
        traefik.http.routers.servus-app-acme.rule: 'Host(`test.servus.run`) && PathPrefix(`/.well-known/acme-challenge/`)'
        traefik.http.routers.servus-app-acme.entrypoints: web
        traefik.http.routers.servus-app-acme.priority: '1200'
        traefik.http.routers.servus-app-acme.service: servus-app-acme
        traefik.http.services.servus-app-acme.loadbalancer.server.port: '80'
        traefik.http.routers.servus-app-http.rule: 'Host(`test.servus.run`)'
        traefik.http.routers.servus-app-http.entrypoints: web
        traefik.http.routers.servus-app-http.priority: '1000'
        traefik.http.routers.servus-app-http.middlewares: servus-app-https
        traefik.http.routers.servus-app-http.service: servus-app-acme
        traefik.http.middlewares.servus-app-https.redirectscheme.scheme: https
        traefik.http.middlewares.servus-app-https.redirectscheme.permanent: 'true'
networks:
  ingress:
    external: true
    name: panel-ingress
