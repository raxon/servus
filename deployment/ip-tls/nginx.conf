user nobody nogroup;
worker_processes 1;
error_log stderr warn;
pid /run/servus-ip-tls/nginx.pid;
events { worker_connections 1024; }
http {
  access_log off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 443 ssl;
    server_name 159.65.115.230;
    ssl_certificate /var/lib/servus-ip-tls/production/config/live/servus-ip/fullchain.pem;
    ssl_certificate_key /var/lib/servus-ip-tls/production/config/live/servus-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($host != '159.65.115.230') { return 444; }
    location / {
      proxy_pass http://127.0.0.1:4180;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 1h;
      proxy_buffering off;
    }
  }
}
