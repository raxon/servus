name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install npm
        run: npm install --global npm@11.19.1
      - name: Install dependencies
        run: npm ci
      - name: Check types
        run: npm run typecheck
      - name: Test panel
        run: npm run test:panel
      - name: Test installer
        run: npm run test:installer
      - name: Test signed installer handoff
        run: |
          docker run --rm --network none \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            python:3.12-slim \
            sh -ec 'ln -s /usr/local/bin/python3 /usr/bin/python3; python3 -I /workspace/tests/install/signed-bootstrap-e2e.py'
      - name: Test VPS harness
        run: npm run test:vps-harness
      - name: Test release discovery
        run: python3 -B -m unittest discover -s tests/updater -p 'test_discover_release.py'
      - name: Test release artifact
        env:
          SERVUS_RELEASE_DOCKER_TEST: '1'
        run: python3 -B -m unittest discover -s tests/release -v
      - name: Test updater in isolated Linux
        run: |
          docker run --rm --network none \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            --tmpfs /run:rw,nosuid,nodev,size=16m \
            --mount "type=bind,source=$GITHUB_WORKSPACE/apps/updater,target=/source/apps/updater,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/tests/updater,target=/source/tests/updater,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/deployment/systemd,target=/source/deployment/systemd,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/scripts/release-install-files.txt,target=/source/release-install-files.txt,readonly" \
            --workdir /work python:3.12-slim \
            sh -ec 'mkdir -p apps tests scripts deployment; cp -R /source/apps/updater apps/; cp -R /source/tests/updater tests/; cp -R /source/deployment/systemd deployment/; cp /source/release-install-files.txt scripts/; exec python3 -I -B -m unittest discover -s tests/updater'
      - name: Test lifecycle gate
        env:
          SERVUS_LIFECYCLE_TEST_CONTEXT: default
        run: node --test tests/lifecycle-gate/gate.test.mjs
      - name: Test updater socket access
        env:
          SERVUS_SOCKET_TEST_CONTEXT: default
        run: node tests/integration/updater-socket.mjs
      - name: Validate supervised Compose template
        run: node tests/integration/supervised-compose.mjs
      - name: Test installation file extraction with Docker
        run: |
          set -euo pipefail
          name="servus-extract-dind-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          image="servus-extract-ci:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm -f "$name" >/dev/null 2>&1 || true
            docker image rm "$image" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for version in 28 29; do
            if [[ "$version" == 28 ]]; then
              base='docker:28.0.4-dind@sha256:4de6a5668da5d138bf9c18b29d2702e43c8773daee085087ba4fac61a6d34b7f'
              mode='--expect-unsupported'
            else
              base='docker:29-dind@sha256:7bf70dcb85c822e3fa6f2d332143e474b99147b9d7b39102b0cfe8b04a7dd61b'
              mode=''
            fi
            docker build --tag "$image" - <<EOF
          FROM $base
          RUN apk add --no-cache python3 && ln -s /usr/local/bin/docker /usr/bin/docker
          EOF
            docker run -d --privileged --network none --name "$name" \
              --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" "$image" \
              dockerd --host=unix:///var/run/docker.sock --iptables=false --ip6tables=false --bridge=none
            ready=0
            for attempt in {1..40}; do
              if docker exec "$name" docker info >/dev/null 2>&1; then ready=1; break; fi
              sleep 1
            done
            if [[ "$ready" != 1 ]]; then docker logs "$name"; exit 1; fi
            server=$(docker exec "$name" docker version --format '{{.Server.Version}}')
            [[ "$server" == "$version".* ]] || { echo 'Unexpected Docker version' >&2; exit 1; }
            if [[ -n "$mode" ]]; then
              docker exec "$name" python3 -I -B /workspace/tests/extract-install/docker-e2e.py "$mode"
            else
              docker exec "$name" python3 -I -B /workspace/tests/extract-install/docker-e2e.py
              docker exec "$name" python3 -I -B /workspace/tests/updater/prepare-local-docker-e2e.py
            fi
            cleanup
          done
      - name: Build workspace
        run: npm run build
      - name: Test session isolation in Chromium
        run: |
          npx playwright install --with-deps chromium
          node tests/integration/session-races.mjs
          node tests/integration/private-git.mjs
          node tests/integration/update-settings.mjs
      - name: Test control-plane capture and restore
        run: |
          set -euo pipefail
          scratch=$(mktemp -d)
          image="servus-backup-ci:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(openssl rand -hex 8)"
          cleanup() {
            docker image rm "$image" >/dev/null 2>&1 || true
            rm -rf -- "$scratch"
          }
          trap cleanup EXIT
          mkdir -p "$scratch/apps/panel" "$scratch/apps/website" "$scratch/apps/updater" "$scratch/tests/updater"
          cp package.json package-lock.json "$scratch/"
          cp apps/panel/package.json "$scratch/apps/panel/"
          cp apps/website/package.json "$scratch/apps/website/"
          cp -R apps/panel/dist "$scratch/panel-dist"
          cp apps/updater/adoption-proof.py apps/updater/backup.py apps/updater/legacy-stop.py apps/updater/supervisor.py apps/updater/supervisor-daemon.py apps/updater/runtime-policy.py apps/updater/update-coordinator.py apps/updater/restore-snapshot.py apps/updater/quiescence.py apps/updater/servus-updater.py "$scratch/apps/updater/"
          cp tests/updater/test_backup.py tests/updater/test_update_coordinator.py tests/updater/test_updater.py tests/updater/test_runtime_policy.py tests/updater/test_supervisor.py "$scratch/tests/updater/"
          docker build --file tests/backup-ci/Dockerfile --tag "$image" "$scratch"
          docker run --rm --user 0:0 --network none --read-only --cgroupns=host --memory 1200m --pids-limit 256 \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            --tmpfs /run:rw,nosuid,nodev,size=16m \
            --tmpfs /root:rw,nosuid,nodev,size=16m \
            --entrypoint python3 "$image" -I -B -c \
            'import sys,unittest; sys.path.insert(0,"tests/updater"); suite=unittest.defaultTestLoader.loadTestsFromNames(["test_backup", "test_update_coordinator", "test_updater.JournalContractTest", "test_runtime_policy.LockedActivationTests"]); result=unittest.TextTestRunner(verbosity=2).run(suite); sys.exit(0 if result.wasSuccessful() and result.testsRun > 1 and not result.skipped else 1)'
          docker run --rm --user 0:0 --network none --read-only --cgroupns=private --memory 1200m --pids-limit 256 \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m --tmpfs /run:rw,nosuid,nodev,size=16m --tmpfs /root:rw,nosuid,nodev,size=16m \
            --env SERVUS_CGROUP_EXPECT=private --entrypoint python3 "$image" -I -B -c \
            'import sys,unittest; sys.path.insert(0,"tests/updater"); suite=unittest.defaultTestLoader.loadTestsFromName("test_backup.CaptureTest.test_real_cgroup_namespace_policy"); result=unittest.TextTestRunner(verbosity=2).run(suite); sys.exit(0 if result.wasSuccessful() and result.testsRun == 1 and not result.skipped else 1)'
