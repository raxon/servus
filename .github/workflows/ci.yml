name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install npm
        run: npm install --global npm@11.19.1
      - name: Install dependencies
        run: npm ci
      - name: Check types
        run: npm run typecheck
      - name: Test panel
        run: npm run test:panel
      - name: Test installer
        run: npm run test:installer
      - name: Test VPS harness
        run: npm run test:vps-harness
      - name: Test release discovery
        run: python3 -B -m unittest discover -s tests/updater -p 'test_discover_release.py'
      - name: Build workspace
        run: npm run build
