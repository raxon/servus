name: Release container image

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  release-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release ref
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'Expected a stable vMAJOR.MINOR.PATCH tag.' >&2; exit 1; }
          python3 -c 'import json, os; version=json.load(open("package.json"))["version"]; assert os.environ["RELEASE_TAG"] == "v"+version, "Tag and package version do not match"'
          commit=$(git rev-parse --verify 'HEAD^{commit}')
          git merge-base --is-ancestor "$commit" refs/remotes/origin/main || { echo 'Release commit is not on main.' >&2; exit 1; }
          image="ghcr.io/${REPOSITORY,,}"
          printf 'commit=%s\nimage=%s\ntag=%s\n' "$commit" "$image" "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Prepare clean release context
        env:
          COMMIT: ${{ steps.release.outputs.commit }}
        run: python3 scripts/prepare-release-context.py --revision "$COMMIT" --output "$RUNNER_TEMP/servus-release-context"
      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Verify workspace
        run: |
          npm install --global npm@11.19.1
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Build image from the checked-out commit
        id: build
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.tag }}
          COMMIT: ${{ steps.release.outputs.commit }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 \
            --build-arg "SERVUS_BUILD_VERSION=${VERSION#v}" \
            --build-arg "SERVUS_BUILD_REVISION=$COMMIT" \
            --label "org.opencontainers.image.source=$REPOSITORY_URL" \
            --label "org.opencontainers.image.revision=$COMMIT" \
            --label "org.opencontainers.image.version=$VERSION" \
            --tag "$IMAGE:$VERSION" \
            --file "$RUNNER_TEMP/servus-release-context/Dockerfile.release" \
            "$RUNNER_TEMP/servus-release-context"
          image_id=$(docker image inspect --format '{{.Id}}' "$IMAGE:$VERSION")
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'Invalid built image ID.' >&2; exit 1; }
          printf 'image_id=%s\n' "$image_id" >> "$GITHUB_OUTPUT"
      - name: Test the built image on amd64
        env:
          IMAGE_ID: ${{ steps.build.outputs.image_id }}
          EXPECTED_REVISION: ${{ steps.release.outputs.commit }}
          EXPECTED_VERSION: ${{ steps.release.outputs.tag }}
        run: bash "$RUNNER_TEMP/servus-release-context/scripts/verify-image.sh" "$IMAGE_ID"
      - name: Test supervisor entrypoints in the built image
        env:
          IMAGE_ID: ${{ steps.build.outputs.image_id }}
        run: |
          set -euo pipefail
          docker run --rm --pull=never --network none --read-only --user root \
            --tmpfs /srv:rw,nosuid,nodev,size=128m \
            --tmpfs /tmp:rw,nosuid,nodev,size=32m \
            --mount "type=bind,source=$RUNNER_TEMP/servus-release-context/tests/integration/supervisor-entrypoint.mjs,target=/fixture.mjs,readonly" \
            --env SERVUS_SUPERVISOR_INTEGRATION_FIXTURE=1 \
            --entrypoint node "$IMAGE_ID" /fixture.mjs
      - name: Verify release installation files in the built image
        env:
          IMAGE_ID: ${{ steps.build.outputs.image_id }}
          COMMIT: ${{ steps.release.outputs.commit }}
        run: python3 "$RUNNER_TEMP/servus-release-context/scripts/verify-release-install.py" --revision "$COMMIT" --image-id "$IMAGE_ID"
      - name: Authenticate to GHCR
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
      - name: Push tested image
        id: push
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.tag }}
          IMAGE_ID: ${{ steps.build.outputs.image_id }}
        run: |
          set -euo pipefail
          [[ $(docker image inspect --format '{{.Id}}' "$IMAGE:$VERSION") == "$IMAGE_ID" ]] || { echo 'Image tag no longer references the tested image.' >&2; exit 1; }
          docker push "$IMAGE:$VERSION" | tee "$RUNNER_TEMP/servus-image-push.log"
          digest=$(sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' "$RUNNER_TEMP/servus-image-push.log" | tail -n 1)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'Registry did not return an image digest.' >&2; exit 1; }
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Attest tested image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.release.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Record attested image
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.tag }}
          COMMIT: ${{ steps.release.outputs.commit }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo '### Container image'
            printf -- '- Version: `%s`\n' "$VERSION"
            printf -- '- Commit: `%s`\n' "$COMMIT"
            printf -- '- Image: `%s@%s`\n' "$IMAGE" "$DIGEST"
            echo '- Tested architecture: linux/amd64'
          } >> "$GITHUB_STEP_SUMMARY"
